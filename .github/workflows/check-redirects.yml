name: check-redirects

on:
  pull_request:
    paths:
      - "redirects.config.js"
      - "resolve-redirect.js"
      - "scripts/check-redirects.mjs"
      - "docs/pages/**"
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-redirects.mjs
